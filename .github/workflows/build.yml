name: Build CODM Guest ImGui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android NDK
        shell: bash
        run: |
          set -eux
          NDK="$(find /usr/local/lib/android/sdk/ndk \
            -maxdepth 1 -mindepth 1 -type d \
            | sort -V | tail -n1)"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          test -x "$NDK/ndk-build"

      - name: Fetch dependencies
        shell: bash
        run: |
          set -eux

          rm -rf deps
          mkdir -p deps

          git clone --depth=1 \
            https://github.com/ocornut/imgui \
            deps/imgui

          git clone --depth=1 \
            https://github.com/topjohnwu/zygisk-module-sample \
            deps/zygisk-sample

          mkdir -p jni/include

          cp \
            deps/zygisk-sample/module/jni/zygisk.hpp \
            jni/include/zygisk.hpp

          test -f jni/include/dobby.h
          test -f jni/libs/arm64-v8a/libdobby.a
          test -f jni/include/zygisk.hpp

          ls -lh \
            jni/include/dobby.h \
            jni/include/zygisk.hpp \
            jni/libs/arm64-v8a/libdobby.a

      - name: Build module
        shell: bash
        run: |
          set -eux

          rm -rf build

          cmake \
            -S jni \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build -j2

      - name: Find output
        shell: bash
        run: |
          set -eux

          find build -type f \
            \( -name '*.so' -o -name '*.a' \) \
            -print

          SO="$(find build -type f \
            -name 'libcodm_guest_imgui.so' \
            | head -n1)"

          test -n "$SO"
          test -f "$SO"

          mkdir -p module/zygisk

          cp "$SO" module/zygisk/arm64-v8a.so

          ls -lh module/zygisk/arm64-v8a.so

      - name: Package module
        shell: bash
        run: |
          set -eux

          cd module
          zip -r ../CODM-Guest-ImGui.zip .
          cd ..

          unzip -l CODM-Guest-ImGui.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CODM-Guest-ImGui
          path: CODM-Guest-ImGui.zip
